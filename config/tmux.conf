# MAW tmux Configuration
# Optimized for iPhone remote development via Termius

# ==========================
# Basics
# ==========================
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on                    # Enable mouse support for touch scrolling
set -g history-limit 100000        # Large scrollback buffer
set -g escape-time 0               # No delay for escape key
set -g repeat-time 300             # Short repeat time

# ==========================
# Prefix (keep default Ctrl+b)
# ==========================
# Note: On iPhone Termius, use the Ctrl key in the toolbar
# then press 'b', then the command key

# ==========================
# Window Management
# ==========================
set -g base-index 1                # Windows start at 1 (easier to reach)
setw -g pane-base-index 1          # Panes start at 1

# Status bar - minimal, works on narrow screens
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-left " [#S] "
set -g status-left-length 20
set -g status-right " %H:%M "
set -g status-right-length 10
set -g status-style fg=white,bg=colour234

# Window status
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "[#I:#W]"
setw -g window-status-current-style fg=black,bg=colour39,bold
setw -g window-status-style fg=colour245

# ==========================
# Pane Borders
# ==========================
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour39

# ==========================
# Message Style
# ==========================
set -g message-style fg=black,bg=colour226,bold

# ==========================
# Copy Mode (vi keys)
# ==========================
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# ==========================
# Useful Bindings
# ==========================
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Quick window switching with arrow keys (no prefix needed after prefix)
bind -n C-Left previous-window
bind -n C-Right next-window

# Last window
bind l last-window

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==========================
# MAW Session Layout (optional)
# ==========================
# These keys are reserved for MAW use:
#   Ctrl+b 1 -> master window
#   Ctrl+b 2 -> status window
# These are handled by the maw init script, not tmux config
